<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">

  <title>Glowing Duck Network — Dokumentacja</title>
  <meta name="description" content="Oficjalna dokumentacja i baza wiedzy Glowing Duck Network.">

  <!-- Core Theme Docsify -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">

  <style>
    /* Custom Styling - Glowing Duck Network Aesthetic (#080808 + #ffee00) */
    :root {
      --theme-color: #ffee00;
      --base-background-color: #080808;
      --sidebar-width: 280px;
    }

    body {
      background-color: #080808 !important;
      color: #e0e0e0 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Pasek boczny (Sidebar) */
    .sidebar {
      background-color: #0d0d0f !important;
      border-right: 1px solid #1e1e22 !important;
    }

    .sidebar .app-name-link {
      color: #ffee00 !important;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255, 238, 0, 0.3);
    }

    .sidebar ul li a {
      color: #aaaaaa !important;
      transition: all 0.2s ease;
    }

    .sidebar ul li a:hover,
    .sidebar ul li.active > a {
      color: #ffee00 !important;
      font-weight: bold;
    }

    /* Główna treść i nagłówki */
    .markdown-section h1, 
    .markdown-section h2, 
    .markdown-section h3,
    .markdown-section h4 {
      color: #ffee00 !important;
      text-shadow: 0 0 8px rgba(255, 238, 0, 0.2);
    }

    .markdown-section a {
      color: #ffee00 !important;
      text-decoration: underline;
    }

    .markdown-section code {
      background-color: #141416 !important;
      color: #ffee00 !important;
      border: 1px solid #222226;
      border-radius: 4px;
      padding: 2px 6px;
    }

    .markdown-section pre {
      background-color: #101012 !important;
      border: 1px solid #222226 !important;
      border-radius: 6px;
    }

    .markdown-section pre code {
      color: #e6e6e6 !important;
      border: none !important;
    }

    /* Bloki cytatów / uwag */
    .markdown-section blockquote {
      background-color: #121215 !important;
      border-left: 4px solid #ffee00 !important;
      color: #bbbbbb !important;
    }

    /* Wyszukiwarka */
    .search input {
      background-color: #121215 !important;
      color: #ffffff !important;
      border: 1px solid #222226 !important;
    }
  </style>

</head>

<body>
  <div id="app">Ładowanie dokumentacji...</div>

  <script>
    // Configuration
    window.$docsify = {
      name: 'Glowing Duck Network',
      repo: 'GlowingDuckNetwork/docs',

      // Sidebar Configuration
      auto2top: true,
      loadSidebar: true,
      maxLevel: 4,
      subMaxLevel: 3,

      // Search Plugin Configuration
      search: {
        placeholder: 'Szukaj w dokumentacji...',
        noData: 'Brak wyników!',
        depth: 3
      }
    };
  </script>

  <!-- Required -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>

  <!-- Recommended Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.js"></script>

</body>
</html>
